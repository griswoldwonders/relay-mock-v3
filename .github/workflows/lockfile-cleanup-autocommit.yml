name: One-shot Lockfile Cleanup

on:
  push:
    branches: [feature/tdm-program-ops]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/tdm-program-ops
          fetch-depth: 2
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Restore base lockfile and apply only patched nanoid
        run: |
          git fetch origin main --depth=1
          git show origin/main:package-lock.json > package-lock.json
          node - <<'NODE'
          const fs = require('fs');
          const path = 'package-lock.json';
          let text = fs.readFileSync(path, 'utf8');
          const oldBlock = '"version": "3.3.17",\n      "resolved": "https://registry.npmjs.org/nanoid/-/nanoid-3.3.17.tgz",\n      "integrity": "sha512-xQLf0A3HOMlgHq0n247/LRuAOYmB7dXJ/DvAxGvsSBij45XtBSmQycu+F8ODbHwns/XyFZagyL1+J0Offw1E0g=="';
          const newBlock = '"version": "3.3.18",\n      "resolved": "https://registry.npmjs.org/nanoid/-/nanoid-3.3.18.tgz",\n      "integrity": "sha512-DTg4MJbGMWkfi6VZFdNt2/caMbQy4Ou+Op/hJQvGEWcnVfoA1QA+xzRKAzw9jD6+GVOOeYr/mIcuDSdug6F6+w=="';
          if (!text.includes(oldBlock)) throw new Error('Expected nanoid 3.3.17 lockfile block not found');
          fs.writeFileSync(path, text.replace(oldBlock, newBlock));
          NODE
      - name: Verify locked install and audit
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Verify build and tests
        run: |
          npm run build
          npm run test:sites
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/lockfile-cleanup-autocommit.yml
      - name: Commit clean lockfile diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/lockfile-cleanup-autocommit.yml
          git diff --cached --quiet && exit 0
          git commit -m "Keep nanoid security update minimal"
          git push origin HEAD:feature/tdm-program-ops
