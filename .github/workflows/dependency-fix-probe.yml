name: Dependency Fix Probe

on:
  push:
    branches: [feature/tdm-program-ops]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Compute minimal package-lock security fix
        run: npm audit fix --package-lock-only
      - name: Show package changes
        run: git diff -- package.json package-lock.json
      - name: Verify audit after proposed fix
        run: npm audit --audit-level=high
      - name: Build after proposed fix
        run: npm run build
      - name: Run static worker tests
        run: npm run test:sites
